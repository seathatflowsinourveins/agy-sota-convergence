name: SOTA Convergence Gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 17-Gate Manifest, Unit Tests, Static & Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner egress telemetry
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"

      - name: Set up mise pinned CLI tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true

      - name: Verify sealed manifest (17/17 gates, double determinism run)
        run: |
          python3 scripts/verify_manifest.py --verify
          python3 scripts/verify_manifest.py --verify

      - name: Run stdlib unittest suite (hooks, handoff, manifest mutations, host contract)
        run: python3 -m unittest discover -s tests -v

      - name: Run ast-grep structural ban scan
        run: |
          uvx --from ast-grep-cli==0.51.3 ast-grep scan
          uvx --from ast-grep-cli==0.51.3 ast-grep scan --no-ignore hidden

      - name: Run Ruff lint and format checks
        run: |
          uvx ruff==0.17.6 check .
          uvx ruff==0.17.6 format --check .

      - name: Run ty static type checker
        run: uvx ty==0.0.112 check

      - name: Run ShellCheck on repository shell scripts
        run: shellcheck scripts/*.sh

      - name: Run Gitleaks secret scan (git history + working tree)
        run: |
          gitleaks git --redact .
          gitleaks detect --no-git --redact --source .

      - name: Run SkillEvaluator Tier 1 keyless skill quality & security gate
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          uvx --python 3.13 skillevaluator==1.2.1 tier1 .agents/skills/sota-convergence-audit --no-llm --output-dir "$tmp_dir"

      - name: Generate Syft CycloneDX SBOM and scan with OSV-Scanner
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          syft dir:. -o cyclonedx-json="$tmp_dir/sbom.cdx.json"
          osv-scanner scan source -L "$tmp_dir/sbom.cdx.json"

      - name: Run Zizmor GitHub Actions security audit (all workflows)
        run: uvx zizmor==1.33.1 --offline .github/workflows/

      - name: Validate Zensical TOML and build docs portal strictly
        run: |
          python3 -c "import tomllib, pathlib; tomllib.loads(pathlib.Path('zensical.toml').read_text(encoding='utf-8')); print('ZENSICAL_TOML_OK')"
          uvx zensical==0.1.3 build --clean --strict
