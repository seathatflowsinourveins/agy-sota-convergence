name: SOTA Docs Portal Build

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "UPSTREAM.md"
      - ".github/workflows/sota-docs-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "UPSTREAM.md"
      - ".github/workflows/sota-docs-pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    name: Build Zensical MADR 4.0 Portal (Strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner egress telemetry
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"

      - name: Build Zensical portal strictly
        run: uvx zensical==0.1.3 build --clean --strict

      - name: Upload built portal artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agy-sota-convergence-docs
          path: site/
          retention-days: 14
          if-no-files-found: error
