id: no-retiring-nov30-models-yaml
language: yaml
severity: error
message: >-
  Retiring 2026-11-30 model slug detected in YAML scalar.
  Migrate to post-Nov-30 frontier models (gemini-4-neon, gemini-4-carbon,
