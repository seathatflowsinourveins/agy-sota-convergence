id: no-live-broker-ports
language: python
severity: error
message: >-
  Live real-money broker endpoint, port (:4001, :7496, :8798, :8796),
  api.alpaca.markets host, or paper=False flag detected in Python code.
  Charter Rule 4 and ADR-0010 strictly forbid live broker bindings in agent code.
ignores:
  - .agents/scripts/pre_tool_fail_closed.py
  - plugins/agy-sota-practice/scripts/pre_tool_fail_closed.py
  - tests/**
  - site/**
  - .git/**
  - .venv/**
  - .ruff_cache/**
rule:
  any:
    - kind: string
      regex: '(?i)(:(4001|7496|8798|8796)(\b|/|$|[^0-9])|api\.alpaca\.markets)'
    - kind: keyword_argument
      regex: '^paper\s*=\s*False$'
    - pattern: paper = False
    - kind: keyword_argument
      regex: '^(?:ib_?)?port\s*=\s*(4001|7496|8798|8796)$'
